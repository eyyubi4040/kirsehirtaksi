version: '3.8'

services:
  kirsehirtaksi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kirsehirtaksi-web
    restart: always
    environment:
      - PORT=3000
      - NODE_ENV=production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
