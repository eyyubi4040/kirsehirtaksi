<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Sayfa Bulunamadı | Kırşehir Taksi</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- Dual-mode Link Resolver (Guarantees zero ERR_FILE_NOT_FOUND on local double-click & preserves Clean URLs on server) -->
  <script>
    (function() {
      if (window.location.protocol === 'file:') {
        function rewriteAllLinks() {
          var links = document.querySelectorAll('a[href]');
          for (var i = 0; i < links.length; i++) {
            var h = links[i].getAttribute('href');
            if (h && h.startsWith('/') && !h.startsWith('//')) {
              var c = h.slice(1);
              var target = (!c || c === '') ? 'index.html' : (c.indexOf('.') !== -1 ? c : c + '.html');
              links[i].setAttribute('href', target);
            }
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', rewriteAllLinks);
        } else {
          rewriteAllLinks();
        }
        if (window.MutationObserver) {
          new MutationObserver(rewriteAllLinks).observe(document.documentElement, { childList: true, subtree: true });
        }
        function handleNav(e) {
          var t = e.target.closest('a[href]');
          if (!t) return;
          var h = t.getAttribute('href');
          if (h && h.startsWith('/') && !h.startsWith('//')) {
            e.preventDefault();
            var c = h.slice(1);
            var f = (!c || c === '') ? 'index.html' : (c.indexOf('.') !== -1 ? c : c + '.html');
            window.location.href = f;
          }
        }
        document.addEventListener('click', handleNav, true);
        document.addEventListener('auxclick', handleNav, true);
      }
    })();
  </script>
</head>
<body style="min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:20px;">
  <div style="max-width:540px;">
    <img src="assets/images/logo.png" alt="Kırşehir Taksi" style="height:64px; margin:0 auto 28px;">
    <div style="font-size:72px; font-weight:800; color:var(--color-primary); font-family:var(--font-heading); line-height:1;">404</div>
    <h1 style="font-size:26px; color:#fff; margin:16px 0 12px; font-family:var(--font-heading);">Aradığınız Güzergah Bulunamadı</h1>
    <p style="color:var(--color-text-muted); font-size:15px; margin-bottom:28px;">
      Ulaşmak istediğiniz sayfa taşınmış veya silinmiş olabilir. Ancak merak etmeyin, taksiniz 7/24 kapınızda!
    </p>
    <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
      <a href="/" class="btn-emergency"><i class="fa-solid fa-house"></i> Ana Sayfaya Dön</a>
      <a href="tel:+905412134040" class="btn-hero-call"><i class="fa-solid fa-phone"></i> Taksi Çağır</a>
    </div>
  </div>
</body>
</html>
